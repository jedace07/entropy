# Bootstrap the standalone uv executable without installing through pip.
name: uv
buildsystem: simple
build-commands:
  - python3 -m zipfile -e uv.whl uv-bootstrap
  - install -Dm755 uv-bootstrap/uv-0.13.9.data/scripts/uv /app/bin/uv
cleanup:
  - '*'
