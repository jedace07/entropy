name: Publish builds

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flatpak:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-26.08
      options: --privileged
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build Flatpak bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: flatpak/io.github.jedace07.Entropy.yaml
          bundle: entropy-x86_64.flatpak
          arch: x86_64
          build-dir: flatpak-build
          repo-dir: flatpak-repo
          artifact-name: flatpak-x86_64

  windows:
    runs-on: windows-latest
    env:
      UV_NO_EDITABLE: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Set up MSVC and Windows SDK
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64

      - run: uv sync --locked --no-dev --group windows-build

      - name: Install Qt Installer Framework
        run: |
          uv run --locked --no-dev --group windows-build aqt install-tool windows desktop tools_ifw qt.tools.ifw.47 --outputdir "$env:RUNNER_TEMP/qtifw"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $binarycreator = Get-ChildItem "$env:RUNNER_TEMP/qtifw" -Recurse -Filter binarycreator.exe | Select-Object -First 1
          if (-not $binarycreator) { throw "Qt Installer Framework binarycreator.exe was not installed." }
          "QTIFW_BINARYCREATOR=$($binarycreator.FullName)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build OpenCL runtime
        run: uv run --locked --no-dev --group windows-build python scripts/build_mnn.py --jobs 2

      - name: Build Windows application and installer
        run: uv run --locked --no-dev --group windows-build python scripts/package_windows.py

      - name: Check installed application and uninstall flow
        run: uv run --locked --no-dev --group windows-build python scripts/check_windows_install.py dist/entropy-windows-x86_64-setup.exe

      - uses: actions/upload-artifact@v7
        with:
          name: windows-x86_64
          path: dist/entropy-windows-x86_64-setup.exe
          if-no-files-found: error
          compression-level: 0

  release:
    needs: [flatpak, windows]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            release/entropy-x86_64.flatpak
            release/entropy-windows-x86_64-setup.exe
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
