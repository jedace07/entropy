[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[project]
name = "entropy"
version = "0.2.1a2"
description = "Entropy: a Qt Quick image upscaler powered by MNN with OpenCL and Metal backends"
readme = "README.md"
license = "MPL-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "jedace07", email = "jedacev07@gmail.com" }
]
requires-python = ">=3.14,<3.15"
dependencies = [
    "numpy>=2.5.4,<3",
    "Pillow>=13.0.0,<14",
    "platformdirs>=4.14.5,<5",
    "pydantic>=2.14.3,<3",
    "PySide6>=6.12.0,<7",
]

[project.optional-dependencies]
mnn = ["MNN>=3.6.2,<4"]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.2.0,<10",
    "ruff>=0.17.5",
]
windows-build = ["Nuitka==4.1.1", "aqtinstall==3.3.0"]

[project.scripts]
entropy = "entropy.__main__:main"
app = "entropy.__main__:main"

[tool.pyside6-project]
# The entry point, the module declaring QML types and one QML file, for QML tooling metadata
files = ["src/entropy/__main__.py", "src/entropy/ui/controller.py", "src/entropy/ui/qml/Main.qml"]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.14"
include = ["src", "tests", "scripts"]
exclude = ["**/node_modules", "**/__pycache__", "**/.*", ".venv", "build", "dist", ".agents"]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = [".agents", "tests", "typings"]
force-exclude = true

[tool.ruff.lint]
preview = true
select = ["ALL"]
ignore = [
    # Handled by Ruff format
    "line-too-long",
    "blank-line-with-whitespace",
    "too-many-blank-lines",
    "missing-trailing-comma",
    "bad-quotes-inline-string",
    "extraneous-parentheses",

    # Documentation and type annotations
    "D",  # Not needed here
    "DOC",
    "any-type",
    "missing-return-type-special-method",
    "missing-return-type-public-function",
    "missing-return-type-private-function",

    # Imports and package structure
    "implicit-namespace-package",  # Package lookup can make this annoying
    "useless-import-alias",  # Pyright requires some `as` imports
    # "typing-only-first-party-import",  # False positives with Pydantic
    # "typing-only-third-party-import",  # False positives with Pydantic
    # "typing-only-standard-library-import",  # False positives with Pydantic

    # Function and class design
    "no-self-use",  # Can easily break code
    "boolean-type-hint-positional-argument",
    "boolean-default-value-positional-argument",
    "too-many-arguments",
    "too-many-public-methods",

    # Complexity and control flow
    "complex-structure",
    "too-many-branches",
    "too-many-locals",
    "too-many-statements",
    "magic-value-comparison",  # I hate this rule
    "implicit-return-value",

    # Exceptions
    "suppressible-exception",
    "raise-vanilla-args",  # Over-eager rule
    "raise-within-try",  # Unrealistic rule
    # "raw-string-in-exception",  # Fine for libs like discord.py

    # Async code
    "unused-async",  # Can easily break code
    "async-function-with-timeout",

    # Logging and console output
    "print",
    "logging-f-string",  # I hate this rule

    # Subprocess security
    "suspicious-subprocess-import",
    "subprocess-popen-with-shell-equals-true",
    "subprocess-without-shell-equals-true",

    # Source and repository hygiene
    "ERA",  # Keep commented-out code
    "missing-todo-link",
    "line-contains-todo",
    "missing-copyright-notice",
    "shebang-missing-executable-file",
    "ambiguous-unicode-character-string",
    "unsorted-dunder-all",  # Public export order is a tested compatibility contract
    "unsorted-dunder-slots",  # Slot order is a tested compatibility contract
    "N",  # Qt and QML need camelCase signals, properties and overrides

    # Data models and library-specific rules
    "function-call-in-dataclass-default-argument",
    "pandas-use-of-dot-values",  # Not a pandas codebase
]
unfixable = [
    "ERA",  # Don't delete commented-out code
    "line-too-long",  # Ruff format handles line length
]

[tool.ruff.lint.per-file-ignores]
# The entry point defers the GUI and worker imports so each process loads only its own side
'src/entropy/__main__.py' = ['import-outside-top-level']
# Build and check scripts deliberately run developer tools found on PATH
'scripts/*.py' = ['start-process-with-partial-path']

[tool.ruff.lint.flake8-type-checking]
# Pydantic resolves field annotations at runtime
runtime-evaluated-base-classes = ['pydantic.BaseModel']

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.isort]
split-on-trailing-comma = true
combine-as-imports = true
required-imports = ["from __future__ import annotations"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false
mark-parentheses = false
parametrize-names-type = "csv"

[tool.ruff.lint.flake8-quotes]
inline-quotes = "single"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"contextlib.suppress".msg = "Use an explicit try/except for performance reasons."

[tool.pytest.ini_options]
testpaths = ["tests"]
# Lets the tests import the build scripts as the `scripts` package
pythonpath = ["."]
