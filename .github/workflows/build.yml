name: Build packages

on:
  workflow_call:
    inputs:
      release:
        description: Fail when the project version already has a GitHub release
        type: boolean
        default: false
    outputs:
      version:
        description: Project version from pyproject.toml in release tag format
        value: ${{ jobs.prepare.outputs.version }}
      is_prerelease:
        description: Whether the project version is a prerelease
        value: ${{ jobs.prepare.outputs.is_prerelease }}
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      is_prerelease: ${{ steps.version.outputs.is_prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v10.4.0

      - name: Resolve release version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ inputs.release }}
        run: |
          version="$(uv run --no-project python -I src/entropy/version.py "$(uv version --short)")"
          if [ "$RELEASE" = 'true' ] && gh release view "v$version" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::error::v$version already has a release. Bump the version with uv version first."
            exit 1
          fi
          if [[ "$version" == *-* ]]; then is_prerelease=true; else is_prerelease=false; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=$is_prerelease" >> "$GITHUB_OUTPUT"

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: "3.14"
          enable-cache: true

      # Qt needs the EGL and GL loaders even when rendering offscreen
      - name: Install Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1

      - name: Smoke test without hardware acceleration
        run: uv run --locked --no-dev python scripts/smoke_test.py

  flatpak:
    needs: prepare
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-26.08
      options: --privileged
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Updating the runtimes baked into the image renames files across overlay layers,
      # which fails with "Invalid cross-device link" on some runners
      - name: Lint the manifest and MetaInfo with Flathub's linter
        run: |
          flatpak-builder-lint --exceptions manifest flatpak/io.github.jedace07.Entropy.yaml
          flatpak-builder-lint --exceptions appstream flatpak/io.github.jedace07.Entropy.metainfo.xml

      - name: Move the Flatpak installation off the container overlay
        run: |
          mkdir -p "$RUNNER_TEMP/flatpak"
          cp -a /var/lib/flatpak/. "$RUNNER_TEMP/flatpak/"
          echo "FLATPAK_SYSTEM_DIR=$RUNNER_TEMP/flatpak" >> "$GITHUB_ENV"

      - name: Build Flatpak bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: flatpak/io.github.jedace07.Entropy.yaml
          bundle: entropy-x86_64.flatpak
          arch: x86_64
          build-dir: flatpak-build
          repo-dir: flatpak-repo
          artifact-name: flatpak-x86_64
          # Flathub serves screenshots from its own mirror, and the linter expects them in the repo
          mirror-screenshots-url: https://dl.flathub.org/media

      - name: Lint the build with Flathub's linter
        run: flatpak-builder-lint --exceptions repo flatpak-repo

  windows:
    needs: prepare
    runs-on: windows-latest
    env:
      UV_NO_EDITABLE: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Set up MSVC and Windows SDK
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64

      - run: uv sync --locked --no-dev --group windows-build

      - name: Install Qt Installer Framework
        run: |
          $binarycreator = ./scripts/install_qt_ifw.ps1 -Destination "$env:RUNNER_TEMP/qtifw"
          "QTIFW_BINARYCREATOR=$binarycreator" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build OpenCL runtime
        run: uv run --locked --no-dev --group windows-build python scripts/build_mnn.py --jobs 2

      - name: Build Windows application and installer
        run: uv run --locked --no-dev --group windows-build python scripts/package_windows.py

      - name: Check installed application and uninstall flow
        run: uv run --locked --no-dev --group windows-build python scripts/check_windows_install.py dist/entropy-windows-x86_64-setup.exe

      - uses: actions/upload-artifact@v7
        with:
          name: windows-x86_64
          path: dist/entropy-windows-x86_64-setup.exe
          if-no-files-found: error
          compression-level: 0

  macos:
    needs: prepare
    runs-on: macos-15
    timeout-minutes: 90
    env:
      UV_NO_EDITABLE: '1'
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Install Ninja
        run: brew install ninja

      - run: uv sync --locked --no-dev --group macos-build

      - name: Build Metal runtime
        run: uv run --locked --no-dev --group macos-build python scripts/build_mnn.py --jobs 3

      - name: Package and check the sandboxed application
        run: uv run --locked --no-dev --group macos-build python scripts/package_macos.py

      - uses: actions/upload-artifact@v7
        with:
          name: macos-arm64
          path: dist/entropy-macos-arm64.zip
          if-no-files-found: error
          compression-level: 0

